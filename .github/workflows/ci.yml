name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Offline functional checks
        run: zsh scripts/verify.sh
      - name: Build distributable app
        run: zsh scripts/build-app.sh
      - name: Privacy checks
        run: |
          python3 scripts/audit-release.py
          python3 scripts/audit-release.py --artifact 'dist/Flow Translate.app'
